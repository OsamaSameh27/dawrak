<div class="dashboard-shell" [class.is-sidebar-open]="isSidebarOpen()">
  <app-dashboard-sidebar (navigationSelected)="closeSidebar()" />

  <button
    class="sidebar-backdrop"
    type="button"
    [attr.aria-label]="'dashboard.header.closeSidebar' | translate"
    (click)="closeSidebar()"
  ></button>

  <div class="dashboard-workspace">
    <app-dashboard-header (menuToggle)="toggleSidebar()" />

    <main class="dashboard-main">
      <router-outlet />
    </main>
  </div>
</div>
