<header class="dashboard-header">
  <div class="dashboard-header__leading">
    <button
      class="menu-button"
      type="button"
      [attr.aria-label]="'dashboard.header.toggleSidebar' | translate"
      (click)="menuToggle.emit()"
    >
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>

    <strong>{{ 'dashboard.header.title' | translate }}</strong>
  </div>

  <div class="dashboard-header__actions">
    <app-language-switcher />

    <app-notification-menu />

    @if (user(); as currentUser) {
      <div class="user-summary">
        <span class="user-avatar" aria-hidden="true">{{ currentUser.fullName.charAt(0).toUpperCase() }}</span>
        <span><strong>{{ currentUser.fullName }}</strong><small>{{ roleKey() | translate }}</small></span>
      </div>
    }

    <a class="site-link" routerLink="/">
      <i class="bi bi-box-arrow-up-left" aria-hidden="true"></i>
      <span>{{ 'dashboard.navigation.backToSite' | translate }}</span>
    </a>
  </div>
</header>
