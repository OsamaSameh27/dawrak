<div class="selector-heading">
  <div>
    <span>{{ 'booking.serviceStep.eyebrow' | translate }}</span>
    <h2>{{ 'booking.serviceStep.title' | translate }}</h2>
  </div>
  <p>{{ 'booking.serviceStep.description' | translate }}</p>
</div>

<div class="service-list">
  @for (service of services(); track service.id) {
    <button
      class="service-card"
      type="button"
      [class.is-selected]="selectedId() === service.id"
      [attr.aria-pressed]="selectedId() === service.id"
      (click)="serviceSelected.emit(service.id)"
    >
      <span class="service-icon">
        <i class="bi bi-grid" aria-hidden="true"></i>
      </span>

      <span class="service-copy">
        <strong dir="auto">{{ service.name }}</strong>

        @if (service.description) {
          <small dir="auto">{{ service.description }}</small>
        }
      </span>

      <i class="bi bi-check-circle-fill selected-icon" aria-hidden="true"></i>
    </button>
  }
</div>
